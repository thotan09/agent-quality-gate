name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test with branch coverage
        run: >-
          uv run pytest --cov=agent_quality_gate --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

      - name: Build package
        run: uv run python -m build

      - name: Run example quality gate
        if: matrix.python-version == '3.12'
        run: >-
          uv run agent-quality-gate run examples/support-agent/suite.yaml
          --fixture examples/support-agent/responses.yaml
          --output-dir artifacts

      - name: Upload example reports
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-quality-reports
          path: artifacts/
          if-no-files-found: error
